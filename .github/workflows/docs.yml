name: docs

# Costruisce il sito di documentazione e lo pubblica su GitHub Pages.
# Basato sul workflow generato da 'docmd deploy --github-pages', adattato
# perche' il progetto docmd sta in docs/ e non nella radice del repo.

on:
  # Su main nessun filtro di percorso: il sito si ripubblica a ogni commit.
  # Filtrare sembrava un risparmio, ma significa che un commit che tocca
  # solo firmware/ o openspec/ lascia online un sito che descrive lo stato
  # precedente — e nessuno se ne accorge, perche' la CI e' verde.
  push:
    branches: [main]
  # Nemmeno sulle pull request: un filtro qui farebbe passare verde una PR
  # che rompe il sito, per poi scoprirlo su main dopo il merge.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  render:
    name: Immagini — schema, PCB, contenitore
    runs-on: ubuntu-latest
    # Stessa immagine del workflow hardware: il render dello schema deve
    # venire dallo stesso KiCad che fa ERC e netlist.
    container:
      image: kicad/kicad:10.0.8-full
      options: --user root

    # Nei job in container Actions sceglie la shell da solo, e in questa
    # immagine sceglie 'sh -e {0}' — cioe' dash — anche se /usr/bin/bash
    # c'e'. Qualunque bashismo in un passo diventa cosi' un guasto silenzioso.
    # Dichiararla toglie la scoperta di mezzo.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - name: Strumenti di contorno
        # librsvg per il PNG, ImageMagick per il ritaglio. Openscad solo se
        # il contenitore esiste: e' un pacchetto grosso e serve solo allora.
        # Con openscad serve anche xvfb: il render PNG vuole un contesto
        # OpenGL, e senza display OpenSCAD scrive un file da zero byte
        # uscendo con successo.
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            librsvg2-bin imagemagick python3
          # Niente compgen: e' un builtin di bash, e in un container il
          # passo puo' girare sotto dash, dove "compgen: not found" fa
          # semplicemente prendere il ramo else. L'installazione veniva
          # saltata in silenzio e il job restava verde.
          if find enclosure -maxdepth 1 -name '*.scad' | grep -q .; then
            echo "trovati sorgenti OpenSCAD, installo openscad e xvfb"
            apt-get install -y --no-install-recommends openscad xvfb
          else
            echo "nessun sorgente OpenSCAD"
          fi

      - name: Render
        # --strict: in CI nessuna immagine puo' essere saltata perche'
        # manca uno strumento. Un salto qui diventa un buco sul sito con
        # la pipeline verde, ed e' gia' successo.
        run: ./tools/render.sh --strict

      - uses: actions/upload-artifact@v4
        with:
          name: render
          path: docs/docs/assets/render/
          if-no-files-found: error

  build:
    name: Build e validazione
    runs-on: ubuntu-latest
    needs: render

    steps:
      # checkout superficiale: il plugin git di docmd e' disattivato, quindi
      # la storia dei commit non serve al build
      - uses: actions/checkout@v5

      - name: Riprendi le immagini renderizzate
        uses: actions/download-artifact@v4
        with:
          name: render
          path: docs/docs/assets/render/

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Installa le dipendenze
        working-directory: docs
        # npm ci rispetta il lockfile: la CI costruisce con le stesse
        # versioni usate in locale
        run: npm ci

      - name: Build del sito
        working-directory: docs
        run: npx docmd build

      - name: Validazione dei link interni
        working-directory: docs
        # Solo link interni e file referenziati: i link esterni sono lenti
        # e soggetti a rate limit, farebbero fallire la CI per motivi che
        # non dipendono da noi.
        run: npx docmd validate --strict

      - name: Le immagini referenziate devono esistere davvero
        working-directory: docs
        # Una pagina che cita un'immagine mancante si costruisce senza
        # errori: il buco si vede solo aprendo il sito. E' gia' successo
        # con un PNG da zero byte, con la CI verde.
        run: |
          mancanti=0
          # Il sito e il README: il README punta agli stessi file via URL
          # di Pages, quindi un'immagine che serve solo a lui sparirebbe
          # senza che nessun controllo se ne accorga.
          riferimenti=$(grep -rhoE 'assets/render/[A-Za-z0-9_.-]+' site ../README.md | sort -u)
          for f in $riferimenti; do
            if [ -s "site/$f" ]; then
              echo "ok      $f ($(stat -c%s "site/$f") byte)"
            else
              echo "MANCA   $f"
              mancanti=1
            fi
          done
          exit $mancanti

      - name: Il sito non deve essere vuoto
        working-directory: docs
        run: |
          pagine=$(find site -name '*.html' | wc -l)
          echo "pagine generate: $pagine"
          if [ "$pagine" -lt 5 ]; then
            echo "troppe poche pagine: qualcosa non ha funzionato"
            exit 1
          fi

      - name: Prepara l'artefatto per Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

  deploy:
    name: Pubblicazione su Pages
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
