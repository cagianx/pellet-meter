schema: spec-driven

context: |
  Language: italian
  All artifacts must be written in italian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Progetto: pellet-meter, sensore di livello pellet a batteria.
  Seeed XIAO ESP32C6 + VL53L1X (ToF, I2C) + LiPo, BLE advertising BTHome v2
  verso Home Assistant. Essendo alimentato a batteria, ogni decisione va
  pesata sul consumo. La calibrazione sta in Home Assistant, non nel firmware.

  Il repo fornisce il progetto, non la realizzazione: schema, firmware,
  modello del contenitore, configurazione Home Assistant. Comprare, saldare,
  stampare, misurare la tramoggia e installare sono attivita' di chi
  costruisce e NON vanno tracciate come task. I criteri di accettazione
  stanno nelle spec. Un task descrive cosa si produce (codice, modello,
  configurazione, documentazione), non cosa si prova sul banco.

  Regole del progetto:
  - Il know-how va conservato in docs/ (sito docmd), non solo nei commit:
    motivazioni delle scelte, tentativi falliti, trappole degli strumenti e
    numeri misurati.
  - Tutto cio' che e' obsoleto o superfluo va eliminato: script che hanno
    esaurito il loro compito, file generati, documentazione di uno stato
    passato, dipendenze non piu' usate. Prima di cancellare, verificare che
    il know-how sia gia' conservato in docs/: si elimina l'artefatto, non la
    conoscenza.
  - Le modifiche passano per OpenSpec: prima il change, poi l'implementazione,
    poi l'archiviazione che aggiorna le spec.
  - Vedi CLAUDE.md nella radice per i comandi di verifica e i vincoli tecnici
    gia' noti.

rules:
  tasks:
    - Se il lavoro produce know-how riutilizzabile, includere un task
      esplicito che lo scrive in docs/.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
